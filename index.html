<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shan Frisør - Profesjonell frisør med førsteklasses tjenester. Se våre arbeider og book en time.">
    <title>Shan Frisør</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            background: 
                radial-gradient(circle at 30% 20%, rgba(255,255,255,0.2) 0%, transparent 50%),
                linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 200% 200%;
            animation: moveBackground 10s ease-in-out infinite;
            position: relative;
            
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: -1;
            transform: perspective(1000px) rotateX(2deg) translateZ(-10px);
        }
        
        h1 {
            font-size: 40px;
            color: #333;
            margin: 20px 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }
        
        .gallery {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        
        .gallery img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 3px solid white;
        }
        
        p {
            font-size: 16px;
            color: #333;
            margin: 12px 0;
            line-height: 1.6;
        }
        
        .info-container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 550px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            margin-top: 15px;
        }
        
        .info-container p:first-child {
            font-weight: 600;
            color: #667eea;
            margin-top: 0;
            font-size: 18px;
        }
        
        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            margin: 20px 0;
        }
        
        strong {
            color: #764ba2;
            font-size: 20px;
            display: block;
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .payment-method, .accessibility {
            color: #555;
            padding: 10px 0;
            font-size: 15px;
        }
        
        .payment-method {
            background: rgba(102, 126, 234, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
        }
        
        .accessibility {
            background: rgba(118, 75, 162, 0.05);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
        }
        
        header {
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        footer {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #333;
            text-align: center;
        }
        
        @keyframes moveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
  
    </style>
</head>
<body>
    <header>
        <h1>Shan Frisør</h1>
    </header>
    
    <div class="gallery">
        <img src="https://lh3.googleusercontent.com/p/AF1QipNkWYyl7tB4xgzpjGuaKBvgsbpLaXGCJ_bdVnKz=w243-h406-n-k-no-nu" alt="Shan Frisør Gallery">
        <img src="https://lh3.googleusercontent.com/p/AF1QipNcfgaO2WkJBHTbe6vtObcD-8geP6AFXoqcj94r=w243-h304-n-k-no-nu" alt="Shan Frisør Gallery">
        <img src="https://lh3.googleusercontent.com/p/AF1QipPy6Jeth5IHQYzLeQhqGocSuNJNgZVBRbyn9KJr=w243-h406-n-k-no-nu" alt="Shan Frisør Gallery">
    </div>
    
    <div class="info-container">
        <p>Tøyengata 41, 0578 Oslo</p>
        <p>Stengt · Åpner kl. 10 fredag</p>
        <p>📞 91 90 42 39</p>
        <p>📍 WQ8C+46 Oslo</p>
        
        <div class="divider"></div>
        
        <p class="accessibility">❌ Ingen inngang for personer i rullestol</p>
        
        <strong>Betaling</strong>
        <p class="payment-method">💳 Debetkort</p>
        <p class="payment-method">💳 Kredittkort</p>
        <p class="payment-method">📱 NFC-betaling med mobil</p>
        
        <div class="divider"></div>
        
        <p class="accessibility">👶 Barnevennlig</p>
        
    </div>
    
    <footer>
        <p>Kontakt oss på 91 90 42 39 eller besøk oss på Tøyengata 41, Oslo.</p>
    </footer>

</body>
</html>
